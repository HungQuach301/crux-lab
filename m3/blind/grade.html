<title>Crux M3 Blind Pairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one pair per screen, two stacked thesis cards, a three-way verdict row, a code sheet at the end. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #17202b; --muted: #5a6776; --line: #d5dce3;
  --accent: #1f4f8a; --accent-fg: #ffffff; --chosen: #e3ecf7; --tie: #eef0f2;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --fg: #e6ebf0; --muted: #9aa7b4; --line: #2c3743;
  --accent: #7fb0ec; --accent-fg: #0d1520; --chosen: #1d3350; --tie: #242d37; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --fg: #e6ebf0; --muted: #9aa7b4; --line: #2c3743;
  --accent: #7fb0ec; --accent-fg: #0d1520; --chosen: #1d3350; --tie: #242d37; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 1rem; line-height: 1.45 }
main { max-width: 38rem; margin: 0 auto; padding: 1rem 16px 2rem; display: grid; gap: 1rem }
header { display: grid; gap: .35rem }
.meta { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s }
.q { font-family: var(--serif); font-size: 1.02rem; color: var(--muted); margin: 0; text-wrap: balance }
.cards { display: grid; gap: .75rem }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; display: grid;
  gap: .55rem; min-width: 0 }
.card.chosen { background: var(--chosen); border-color: var(--accent) }
.side { font-family: var(--mono); font-size: .85rem; color: var(--accent) }
.thesis { font-family: var(--serif); font-size: 1.14rem; line-height: 1.42; margin: 0 }
.over { font-size: .92rem; color: var(--muted); margin: 0 }
.over b { font-weight: 600; color: var(--fg) }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem }
.verdict button.tie { grid-column: 1 / -1 }
button { font: 600 1rem var(--sans); border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); padding: .8rem .6rem; cursor: pointer; min-height: 3rem }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.nav { display: flex; justify-content: space-between; gap: .5rem }
.nav button { font-weight: 400; min-height: 2.6rem; padding: .5rem .9rem }
.done { display: grid; gap: .75rem }
.done h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 0; text-wrap: balance }
.code { font-family: var(--mono); font-size: .95rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: .8rem; word-break: break-word; user-select: all }
.hint { font-size: .85rem; color: var(--muted); margin: 0 }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem }
.grid button { font: 500 .85rem var(--mono); min-height: 2.4rem; padding: .3rem }
.grid button.tieon { background: var(--tie) }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none } }
</style>

<main>
  <header>
    <div class="meta"><span id="pos">Pair 01 of 20</span><span id="pillar"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <p class="q" id="question"></p>
  </header>

  <section id="pairView" class="cards" aria-live="polite">
    <article class="card" id="cardA"><span class="side">A</span><p class="thesis" id="thA"></p><p class="over"><b>Overturns:</b> <span id="ovA"></span></p></article>
    <article class="card" id="cardB"><span class="side">B</span><p class="thesis" id="thB"></p><p class="over"><b>Overturns:</b> <span id="ovB"></span></p></article>
    <div class="verdict">
      <button id="vA" data-v="A">A is better</button>
      <button id="vB" data-v="B">B is better</button>
      <button id="vT" class="tie" data-v="=">Can't tell them apart</button>
    </div>
    <div class="nav"><button id="prev">Back</button><button id="toEnd">Review all</button></div>
  </section>

  <section id="endView" class="done" hidden>
    <h2 id="endTitle">Send this code in the chat</h2>
    <div class="code" id="code"></div>
    <button id="copy">Copy code</button>
    <p class="hint" id="copyNote">A = A is better · B = B is better · = can't tell. Tap a pair below to change it.</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const DATA = {"question": "Which thesis would make the better episode for this channel — more surprising, more useful to the viewer, and more defensible with data?", "pairs": [{"pair": "01", "pillar": "Borrowing and debt", "A": {"thesis": "For many income-driven student loan borrowers, extra principal payments can destroy wealth because forgiveness tax risk is smaller than lost liquidity.", "overturns": "\"Student loans should always be attacked before building real financial buffers.\""}, "B": {"thesis": "Even with a big down payment, veterans' home loans have still priced below the best conventional tier, so their upfront fee has paid back within a few years.", "overturns": "\"With a big down payment, a conventional loan beats paying the veteran loan fee.\""}}, {"pair": "02", "pillar": "Borrowing and debt", "A": {"thesis": "Biweekly mortgage plans rarely beat a simple extra principal autopay, after enrollment fees, timing rules, and servicer posting delays are included.", "overturns": "\"Biweekly mortgage payment programs are a secret hack for interest savings.\""}, "B": {"thesis": "When mortgage rates actually fell, rising home prices historically ate only part of the payment relief, so the typical monthly payment still came down.", "overturns": "\"If rates drop, home prices will jump and wipe out any savings.\""}}, {"pair": "03", "pillar": "Borrowing and debt", "A": {"thesis": "A quick refinance after buying at a high mortgage rate is a coin flip: historically, large rate drops arrived within a few years less often than not.", "overturns": "\"Marry the house, date the rate, you can always refinance later.\""}, "B": {"thesis": "Choosing a longer auto loan often raises total car cost far beyond disclosed interest because it keeps borrowers underwater for longer.", "overturns": "\"A longer auto loan is harmless if the monthly payment fits.\""}}, {"pair": "04", "pillar": "Retirement and long-term investing", "A": {"thesis": "Living only on interest from safe short-term government bills left retirees exposed to sudden income collapses that lasted years, even though their principal never shrank.", "overturns": "\"Never touching principal and living on interest alone gives retirees a stable, safe income.\""}, "B": {"thesis": "A low cost target date fund left comparable savers with competitive after tax wealth in history, not a forecast, versus chasing recent winners.", "overturns": "\"Managing your own funds should beat the boring default retirement option.\""}}, {"pair": "05", "pillar": "Borrowing and debt", "A": {"thesis": "For borrowers with strong credit, a small down payment barely moves the locked mortgage rate, while a weaker credit score moves it several times as much.", "overturns": "\"A bigger down payment is the surest way to get a lower mortgage rate.\""}, "B": {"thesis": "A smaller down payment with mortgage insurance can outperform waiting to save more when rents rise and cash reserves prevent expensive debt.", "overturns": "\"Avoid mortgage insurance at all costs before buying a home.\""}}, {"pair": "06", "pillar": "Taxes and policy", "A": {"thesis": "For low-bracket workers receiving refundable family credits, pretax retirement contributions can reduce future flexibility without meaningfully lowering today's tax bill.", "overturns": "\"Pretax retirement saving is automatically the best tax move for every worker.\""}, "B": {"thesis": "Indexing tax amounts to a slower inflation gauge costs a low-wage family with children a larger share of income than it costs a comfortable couple.", "overturns": "\"Tax inflation adjustments fully protect every household from paying more as prices rise.\""}}, {"pair": "07", "pillar": "Retirement and long-term investing", "A": {"thesis": "Capturing the workplace retirement match before sending extra cash to moderate interest debt often wins, even after tax and investment risk are modeled.", "overturns": "\"Pay every debt down before investing for retirement at all.\""}, "B": {"thesis": "Because each cost-of-living raise arrives months after prices rise, Social Security retirees lose purchasing power almost every year, adding up to many missing monthly checks over a retirement.", "overturns": "\"Social Security's annual cost-of-living raise fully protects retirees' benefits from inflation.\""}}, {"pair": "08", "pillar": "Borrowing and debt", "A": {"thesis": "Mortgage insurance on a small down payment could usually have ended years earlier through rising home values than through the legal paydown schedule, but only on request.", "overturns": "\"You're stuck paying mortgage insurance until your balance falls far enough on schedule.\""}, "B": {"thesis": "Buying mortgage points usually loses after typical homeowner turnover and refinancing chances are simulated, even when quoted break-even math looks comfortably positive.", "overturns": "\"Paying points is smart whenever the rate break-even arrives before you move.\""}}, {"pair": "09", "pillar": "Taxes and policy", "A": {"thesis": "A nonrefundable vehicle credit can disappear for moderate-income buyers after family credits, making a cheaper used car win after taxes.", "overturns": "\"A posted tax credit always lowers the car's real price.\""}, "B": {"thesis": "Under current rules, an identical mortgage on an identical house can meaningfully cut federal income tax for a high-tax-state couple and do nothing for a low-tax-state couple.", "overturns": "\"Paying mortgage interest gives every homeowner a tax break on their federal return.\""}}, {"pair": "10", "pillar": "Taxes and policy", "A": {"thesis": "Increasing paycheck withholding late in the year can prevent underpayment penalties more reliably than mailing catch-up estimated payments for gig income.", "overturns": "\"Late estimated payments fix underpayment penalties as well as paycheck withholding.\""}, "B": {"thesis": "College tuition credits use fixed income cutoffs, so a family that once qualified in full, with pay that merely kept pace with prices, now gets nothing.", "overturns": "\"If our income only keeps pace with inflation, we keep qualifying for college tax credits.\""}}, {"pair": "11", "pillar": "Borrowing and debt", "A": {"thesis": "At banks, stretching a new-car loan by an extra year has barely raised the interest rate, so nearly all the added cost comes from paying interest longer.", "overturns": "\"Longer car loans cost more mainly because lenders charge a much higher rate.\""}, "B": {"thesis": "With realistic dropout risk, the debt snowball can eliminate balances faster than avalanche math for borrowers juggling several credit cards.", "overturns": "\"Always pay the highest interest card before any smaller balance.\""}}, {"pair": "12", "pillar": "Taxes and policy", "A": {"thesis": "Under the new child care rules, parents with modest wages usually keep more with the workplace child care account; the bigger credit wins only in a middle band.", "overturns": "\"The bigger child care credit is the best deal for lower-income working parents.\""}, "B": {"thesis": "For partners using marketplace health subsidies, marrying before year-end can raise combined tax owed versus staying unmarried until January, despite shared expenses.", "overturns": "\"Marriage almost always creates a tax bonus for committed partners.\""}}, {"pair": "13", "pillar": "Retirement and long-term investing", "A": {"thesis": "Maxing tax advantaged retirement accounts before using taxable brokerage usually improves long horizon outcomes, despite withdrawal rules and reduced flexibility.", "overturns": "\"Taxable investing is almost as good because retirement accounts trap your money.\""}, "B": {"thesis": "Whether required withdrawals from a retirement account grow or shrink after inflation depends on real interest rates, and at recent rates they keep rising until very old age.", "overturns": "\"Required minimum withdrawals steadily drain a retirement account and shrink retirement income over time.\""}}, {"pair": "14", "pillar": "Borrowing and debt", "A": {"thesis": "Prepaying a long mortgage on a short loan's schedule still costs more and takes longer than the short loan itself, because the lower short-term rate is forfeited.", "overturns": "\"Take the long mortgage and pay extra; you get the same result with flexibility.\""}, "B": {"thesis": "A higher-rate no-closing-cost refinance can leave borrowers richer than paying cash costs when remaining loan life is uncertain and payment savings are invested.", "overturns": "\"Lowest mortgage rate is always the best refinance choice after fees.\""}}, {"pair": "15", "pillar": "Taxes and policy", "A": {"thesis": "Using a payroll-funded medical savings account often beats claiming medical deductions, because payroll taxes fall even when income deductions vanish.", "overturns": "\"Medical expenses mainly help at tax time through itemized deductions.\""}, "B": {"thesis": "In the lower brackets, the new break on car loan interest is worth less than a single point off the loan rate, and it shrinks for later loans.", "overturns": "\"The new tax break makes borrowing for a new car dramatically cheaper.\""}}, {"pair": "16", "pillar": "Retirement and long-term investing", "A": {"thesis": "Strategic conversions from pretax retirement accounts during low income retirement years can reduce lifetime taxes, even for households already in modest brackets.", "overturns": "\"Conversions only help rich retirees facing very high future tax rates.\""}, "B": {"thesis": "Rolling over short-term Treasury bills beat locking in a longer Treasury note held to maturity in a large share of past periods, especially when inflation was building.", "overturns": "\"Locking in a longer-term bond rate always pays more than rolling over short-term cash.\""}}, {"pair": "17", "pillar": "Retirement and long-term investing", "A": {"thesis": "Adding bonds during the final working stretch raised safe retirement income in bad historical sequences, history, not a forecast, even when average returns fell.", "overturns": "\"Stocks always make the best retirement portfolio if your horizon feels long.\""}, "B": {"thesis": "Holding government notes to maturity did not protect savers: notes bought in the later low-rate years all lost purchasing power by the time they repaid.", "overturns": "\"If you hold a Treasury bond until it matures, you cannot lose money.\""}}, {"pair": "18", "pillar": "Retirement and long-term investing", "A": {"thesis": "In every retirement-length stretch since the postwar years, a pension without cost-of-living raises lost a large share of its buying power, even during the calmest inflation periods.", "overturns": "\"In a low-inflation era, a pension without cost-of-living raises holds its value well.\""}, "B": {"thesis": "Delaying Social Security can beat claiming early and investing the checks for retirees near average health, because guaranteed inflation adjusted payments are hard to replicate.", "overturns": "\"Claim early, invest the money, and markets will make waiting look foolish.\""}}, {"pair": "19", "pillar": "Retirement and long-term investing", "A": {"thesis": "After inflation, the yearly cap on personal retirement account contributions is barely higher than when every worker first became eligible, and it covers fewer hours of typical pay.", "overturns": "\"Retirement account contribution limits keep rising, so today's savers can shelter far more than earlier generations.\""}, "B": {"thesis": "For long horizon savers, investing extra cash often beat prepaying low rate mortgages in history, not a forecast, even after taxes and volatility.", "overturns": "\"The mortgage is guaranteed debt, so prepaying must beat retirement investing.\""}}, {"pair": "20", "pillar": "Taxes and policy", "A": {"thesis": "A single owner selling an ordinary median-priced home bought about a decade ago can now owe capital gains tax, because the tax-free limit never adjusts.", "overturns": "\"Only owners of expensive homes ever pay tax when they sell their house.\""}, "B": {"thesis": "Alternating charitable gifts into high-deduction filing periods can beat steady giving, even when total donations and cash flow stay unchanged.", "overturns": "\"The tax benefit of giving depends only on total donated.\""}}]};
const KEY = 'crux-m3-picks-' + '94da8ddd76d2';
let picks = {}, i = 0;
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { picks = {}; }
const n = DATA.pairs.length;
const $ = id => document.getElementById(id);
$('question').textContent = DATA.question;
function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }
function codeText() { return DATA.pairs.map(p => p.pair + (picks[p.pair] || '?')).join(' '); }
function showPair() {
  const p = DATA.pairs[i];
  $('endView').hidden = true; $('pairView').hidden = false;
  $('pos').textContent = 'Pair ' + p.pair + ' of ' + n;
  $('pillar').textContent = p.pillar;
  $('thA').textContent = p.A.thesis; $('ovA').textContent = p.A.overturns;
  $('thB').textContent = p.B.thesis; $('ovB').textContent = p.B.overturns;
  const v = picks[p.pair];
  ['vA', 'vB', 'vT'].forEach(id => $(id).classList.toggle('on', $(id).dataset.v === v));
  $('cardA').classList.toggle('chosen', v === 'A'); $('cardB').classList.toggle('chosen', v === 'B');
  $('prev').disabled = i === 0;
  progress();
}
function progress() { $('prog').style.width = (100 * Object.keys(picks).length / n) + '%'; }
function showEnd() {
  $('pairView').hidden = true; $('endView').hidden = false;
  const left = n - Object.keys(picks).length;
  $('pos').textContent = left ? left + ' pairs left' : 'All ' + n + ' pairs graded';
  $('pillar').textContent = '';
  $('endTitle').textContent = left ? 'Some pairs are still open' : 'Send this code in the chat';
  $('code').textContent = codeText();
  const g = $('grid'); g.textContent = '';
  DATA.pairs.forEach((p, k) => {
    const b = document.createElement('button');
    b.textContent = p.pair + ' ' + (picks[p.pair] || '?');
    if (picks[p.pair] === '=') b.classList.add('tieon');
    if (!picks[p.pair]) b.classList.add('on');
    b.addEventListener('click', () => { i = k; showPair(); });
    g.appendChild(b);
  });
  progress();
}
document.querySelectorAll('.verdict button').forEach(b => b.addEventListener('click', () => {
  picks[DATA.pairs[i].pair] = b.dataset.v; save();
  const next = DATA.pairs.findIndex((p, k) => k > i && !picks[p.pair]);
  const any = DATA.pairs.findIndex(p => !picks[p.pair]);
  if (next >= 0) { i = next; showPair(); } else if (any >= 0) { i = any; showPair(); } else { showEnd(); }
}));
$('prev').addEventListener('click', () => { if (i > 0) { i--; showPair(); } });
$('toEnd').addEventListener('click', showEnd);
$('copy').addEventListener('click', () => {
  const t = codeText();
  const ok = () => { $('copyNote').textContent = 'Copied. Paste it in the chat.'; };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('code'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copyNote').textContent = 'Code selected. Copy it and paste it in the chat.'; };
  try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
});
const first = DATA.pairs.findIndex(p => !picks[p.pair]);
if (first < 0) showEnd(); else { i = first; showPair(); }
</script>
