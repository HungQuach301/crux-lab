      - id: S15-ladder
        template: N2
        from: "@S15.3"
        p:
          mode: ladder
          at: "@S15.3"
          rungsAt0: "@S15.3"
          rungsAt1: "@S15.3+0.8"
          labels:
            - {text: "Your {buy_year} price vs your city's rung", at: "@S15.3", x: 96, y: 100, size: 40}
            - {text: "Your {buy_year} price above", at: "@S15.4", x: 815, y: 560, size: 40, align: right}   # G2 (b): cạnh thang
            - {text: "your city's rung → past the cap", at: "@S15.4", x: 815, y: 608, size: 40, align: right}
            - {text: "Below it: not.", at: "@S15.4:Below", x: 815, y: 656, size: 40, align: right}
            - {text: "Not proof of tax, or of none", at: "@S15.5", x: 96, y: 1016, size: 40}
      - id: S15-measure
        template: title
        from: "@S15.5:The"
        p: {at: "@S15.5:The", lines: ["This video measures one line.", "It says nothing about what anyone does next."], ats: ["@S15.5:The", "@S15.5:it"]}
  - id: S16
    tail: 1.0
    shots:
      - id: S16-side
        template: title
        from: "@S16.1"
        p: {at: "@S16.1", lines: ["Your side: what you paid + improvements", "Selling costs come off the gain too"], ats: ["@S16.1", "@S16.2"]}
      - id: S16-us
        template: bars
        from: "@S16.3"
        p: {at: "@S16.3", title: "National line · {buy_year} price",
            items: [{label: "US, married joint", claim: threshold_joint_us, role: ink, at: "@S16.3:about"},
                    {label: "US, single", claim: threshold_single_us, role: ink, at: "@S16.4:about"}]}
  - id: S17
    tail: 0.8
    shots:
      - id: S17-bill
        template: title
        from: "@S17.1"
        p: {at: "@S17.1", lines: ["Not a tax bill", "Above the cap: {long_term_gain_rule}", "rate depends on income · state tax not modeled"],
