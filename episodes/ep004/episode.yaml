episode: ep004
format: lab            # 9–11 phút, 2 mid-roll ở ranh giới hồi (episode.md §9)
topic: "queue #3 — topics-r1/machine/tax-2 (G1 duyệt 2026-10-05)"
title: "Bought Your Home in 2000? The $500,000 Tax-Free Limit Test"
characters: "Rosa & Frank (ILLUSTRATIVE, Phoenix)"
hook: H2
tokenCeiling: {episode: 4500000, P2: 1000000, P3: 1000000}
pillar: thuế
voice: {provider: elevenlabs, voice: cjVigY5qzO86Huf0OWal, model: eleven_v3, seed: 1004, settings: {stability: 0.5, speed: 0.9}}   # Eric (id như Tập 3)
music: {style: C}      # G-016

# ---- C4 animatic cả tập (nhà máy). Hình: mẫu thư viện + N1/N2; shot S08/S13/S14 giữ nguyên bản đã ký ở C3.
#   python3 episodes/ep004/data/fetch.py --verify && python3 episodes/ep004/model/model.py && python3 episodes/ep004/design/c4/build_inputs.py
#   bash toolkit/build.sh episodes/ep004/episode.yaml && python3 episodes/ep004/design/c4/build_inputs.py --out     (ghi chú: gates/C4.md)
scope: full
script: design/c4/gen/script.json
claims: design/c4/gen/claims.json
tokens: design/c3/gen/tokens.json
data: {file: design/c4/work/data.js, var: DATA}
fps: 30
res: 1080
audio:
  lufs: -14
  true_peak: -1.5
  music: work/factory/music/bed-mr.wav       # C5: nhạc style C (engine Tập 3: 114 BPM, D dorian), sinh lại nếu thiếu; mức dưới lời: toolkit/factory/music.py
  music_cmd: "python3 episodes/ep004/design/c4/bed_mr.py {total} {out}"   # G2 (b): như C5 + nhạc về 0 quanh MR1/MR2 (lặng ≥ 1 s)
dossier: {script_md: story/script.md, claim_risk: ../../topics-r1/machine/tax-2/claim-risk.md, contract: contract.json}
# mid-roll: trong khoảng giữ 1,5 s cuối S07 (hết Hồi 1) và cuối S14 (hết Hồi 2), theo giọng thật (out/factory/timeline.json)
midrolls:
  - {after_act: act1, scene: S07, t: 180.05}  # giữa khoảng giữ 1,5 s sau S07.6 (lời hết 179,31 s; cảnh hết 180,80 s)
  - {after_act: act2, scene: S14, t: 349.3}   # giữa khoảng giữ 1,5 s sau S14.5 (lời hết 348,57 s; cảnh hết 350,07 s)
acts:
  - {id: cold-open, scenes: [S01, S02]}
  - {id: act1, scenes: [S03, S04, S05, S06, S07]}
  - {id: act2, scenes: [S08, S09, S10, S11, S12, S13, S14]}
  - {id: act3, scenes: [S15, S16, S17]}
  - {id: method, scenes: [S18]}
  - {id: outro, scenes: [S19]}
# BẮT BUỘC (spec.py): claim-risk tax-2 "Always say" → hiện trên mọi khung có ngưỡng / tăng trưởng / lãi của một vùng.
counterweights:
  - id: avg-home
    text: "A home that rose like the metro average"
    # S09/S10 (12 thanh) và gain_at_200k_phoenix (thanh Phoenix ở S09): điều kiện nằm trong chữ của shot ("rose like their metro average"), không qua dòng engine (va chạm giá trị)
    claims: [threshold_joint_phoenix, threshold_joint_min, threshold_joint_max,
             threshold_joint_miami, threshold_joint_los_angeles, threshold_joint_san_diego, threshold_joint_seattle, threshold_joint_new_york,
             threshold_joint_dallas, threshold_joint_boston, threshold_joint_denver, threshold_joint_us, threshold_joint_san_jose,
             threshold_joint_san_francisco, threshold_joint_chicago, growth_miami, growth_chicago, growth_phoenix, threshold_single_us,
            ]
  - id: measurement          # C3 vòng 2: B08 dòng engine; B13/B14 nhãn shot N2 đáy-trái
    text: "A measurement, not a tax bill or a next step"
    claims: [exclusion_effective_month, excl_joint_1997_in_now]
custom_symbols:             # 2 ký hiệu mới đã duyệt ở G1 (CHARTER §5: ≤ 2)
  - {id: N1, file: design/c3/n1.js}
  - {id: N2, file: design/c4/n2-g2.js}   # G2 (b): N2 của C3 (không đổi) + chế độ 'line'/'bars' = mẫu thư viện + nhãn nghĩa (§6.6)

scenes:
  - id: S01                 # móc H2 (KEY-1, loại 2)
    tail: 0.4
    shots:
      - id: S01-gain
        template: bignum
        from: "@S01.1"
        p: {claim: gain_at_200k_phoenix, at: "@S01.1:About", caption: "gain on paper · {illustrative_price_200k_usd} home that rose like the Phoenix average",
            captionAt: "@S01.1:paper", sub: "more than the tax-free cap: {excl_joint_limit_usd}", subAt: "@S01.1:more", illustrative: true}
      - id: S01-couple
        template: person
        from: "@S01.2"
        p: {at: "@S01.2", caption: ["Rosa & Frank · Phoenix", "bought in {buy_year} for {illustrative_price_200k_usd}", "if their home rose like the Phoenix average"],
            ats: ["@S01.2", "@S01.2:bought", "@S01.2:if"]}
      - id: S01-promise
        template: title
        from: "@S01.3"
        p: {at: "@S01.3", kicker: "US only", lines: ["City by city: the {buy_year} price", "where the gain passes the cap", "your {buy_year} price → check it against your city"],
            ats: ["@S01.3", "@S01.3:passes", "@S01.3:check"]}
  - id: S02
    tail: 0.8
    shots:
      - id: S02-limits
        template: title
        from: "@S02.1"
        p: {at: "@S02.1", lines: ["A line, not a tax bill · not a reason to sell or keep", "US federal tax only · state tax not modeled",
                                  "Illustrative couples · use test: {ownership_use_test}", "History, not a forecast"],
            ats: ["@S02.1", "@S02.2", "@S02.3", "@S02.4"]}
  - id: S03
    tail: 0.6
    shots:
      - id: S03-gain
        template: title
        from: "@S03.1"
        p: {at: "@S03.1", lines: ["gain = sale price − what you paid − improvements"], ats: ["@S03.1:gain"]}
      - id: S03-caps
        template: bars
        from: "@S03.2"
        p: {at: "@S03.2", title: "Tax-free cap on the gain · since {exclusion_effective_month}",
            items: [{label: "married, joint", claim: excl_joint_limit_usd, role: muted, at: "@S03.2:married"},
                    {label: "single", claim: excl_single_limit_usd, role: muted, at: "@S03.2:single"}]}
  - id: S04
    tail: 1.0
    shots:
      - id: S04-couple
        template: person
        from: "@S04.1"
        p: {at: "@S04.1", caption: ["Rosa & Frank · Phoenix", "paid {illustrative_price_200k_usd} in {buy_year}", "“At least it’s tax-free.”", "Is it?"],
            ats: ["@S04.1", "@S04.2:paid", "@S04.4:at", "@S04.5"]}
  - id: S05
    tail: 0.4
    shots:
      - id: S05-index
        template: line
        from: "@S05.1"
        p: {series: index.phoenix, title: "Phoenix-area home price index (FHFA via FRED)", at0: "@S05.1:Phoenix", at1: "@S05.2$", historical: true}
  - id: S06                 # KEY-2 (loại 1): V3 vạch cố định + đường lãi
    tail: 1.0
    shots:
      - id: S06-cross
        template: N2          # G2 (b): mẫu line + nhãn trần trái, mốc quý, đối trọng đứng
        from: "@S06.1"
        p: {mode: line, levelSide: left, note: {text: "A measurement, not a next step", x: 180, y: 430},
            marks: [{claim: cross_quarter_at_200k_phoenix, text: "Over: {cross_quarter_at_200k_phoenix}"},
                    {claim: stay_quarter_at_200k_phoenix, text: "Stayed over since {stay_quarter_at_200k_phoenix}"}],
            series: gain200.phoenix, level: excl_joint_limit_usd, levelLabel: "{excl_joint_limit_usd} cap", levelAt: "@S06.1",
            title: "Gain on paper: {illustrative_price_200k_usd} home that rose like the Phoenix average",
            at0: "@S06.2", at1: "@S06.5+3", illustrative: true, historical: true}
  - id: S07
    tail: 1.5                 # MR1 trong khoảng giữ
    shots:
      - id: S07-gain
        template: bignum
        from: "@S07.1"
        p: {claim: gain_at_200k_phoenix, at: "@S07.1:gain", caption: "past the {excl_joint_limit_usd} cap", captionAt: "@S07.2", sub: "a home that rose like the Phoenix average", subAt: "@S07.1:gain", illustrative: true}
      - id: S07-growth
        template: bignum
        from: "@S07.3"
        p: {claim: growth_phoenix, at: "@S07.3:almost", caption: "Phoenix-area prices since {buy_year}", captionAt: "@S07.3:2000"}
      - id: S07-not
        template: title
        from: "@S07.4"
        p: {at: "@S07.4", lines: ["A gain, not a tax bill", "improvements and selling costs would shrink it"], ats: ["@S07.4", "@S07.4:improvements"]}
      - id: S07-line
        template: line
        from: "@S07.5"
        p: {series: gain200.phoenix, level: excl_joint_limit_usd, levelLabel: "{excl_joint_limit_usd} cap", at0: "@S07.5", at1: "@S07.5+1.2",
            title: "Gain on paper: {illustrative_price_200k_usd} home that rose like the Phoenix average", illustrative: true, historical: true}
      - id: S07-q
        template: title
        from: "@S07.6"
        p: {at: "@S07.6", lines: ["Is Phoenix unusual?", "Would the same happen in other cities?"], ats: ["@S07.6", "@S07.6:would"]}
  - id: S08
    tail: 1.2
    shots:
      - id: S08-shadow
        template: N1
        from: "@S08.1"
        p:
          at: "@S08.1"
          noteAt: "@S08.2:never"
          at0: "@S08.3"
          at1: "@S08.3:about"
          labelAt: "@S08.3:about"
          footAt: "@S08.3"
          bigAt: "@S08.4"
  - id: S09                 # KEY-4a (loại 1)
    tail: 0.6
    shots:
      - id: S09-bars
        template: N2          # G2 (b): mẫu bars + dòng đơn vị
        from: "@S09.1"
        p: {mode: bars, unit: "Gain today · past the cap = gain over {excl_joint_limit_usd}", titleV: "Gain today, {illustrative_price_200k_usd} in {buy_year} · past the cap = over {excl_joint_limit_usd}", at: "@S09.1:illustrative", title: "{illustrative_price_200k_usd} in {buy_year}, homes that rose like their metro average", items: [{label: "Chicago", claim: gain_at_200k_chicago, role: ink, at: "@S09.1+0.00"}, {label: "San Francisco", claim: gain_at_200k_san_francisco, role: ink, at: "@S09.1+0.15"}, {label: "San Jose", claim: gain_at_200k_san_jose, role: ink, at: "@S09.1+0.30"}, {label: "Denver", claim: gain_at_200k_denver, role: ink, at: "@S09.1+0.45"}, {label: "Boston", claim: gain_at_200k_boston, role: ink, at: "@S09.1+0.60"}, {label: "Dallas", claim: gain_at_200k_dallas, role: ink, at: "@S09.1+0.75"}, {label: "New York", claim: gain_at_200k_new_york, role: ink, at: "@S09.1+0.90"}, {label: "Seattle", claim: gain_at_200k_seattle, role: warn, at: "@S09.1+1.05"}, {label: "Phoenix", claim: gain_at_200k_phoenix, role: warn, at: "@S09.1+1.20"}, {label: "San Diego", claim: gain_at_200k_san_diego, role: warn, at: "@S09.1+1.35"}, {label: "Los Angeles", claim: gain_at_200k_los_angeles, role: warn, at: "@S09.1+1.50"}, {label: "Miami", claim: gain_at_200k_miami, role: warn, at: "@S09.1+1.65"}]}
      - id: S09-count
        template: N2          # G2 (b): mẫu bars + dòng đơn vị
        from: "@S09.2"
        p: {mode: bars, unit: "Gain today · past the cap = gain over {excl_joint_limit_usd}", titleV: "{metros_crossed_at_200k} of {metro_count} past the cap = gain over {excl_joint_limit_usd}", at: 0, title: "{metros_crossed_at_200k} of {metro_count} past the cap · homes that rose like their metro average", items: [{label: "Chicago", claim: gain_at_200k_chicago, role: ink, at: 0}, {label: "San Francisco", claim: gain_at_200k_san_francisco, role: ink, at: 0}, {label: "San Jose", claim: gain_at_200k_san_jose, role: ink, at: 0}, {label: "Denver", claim: gain_at_200k_denver, role: ink, at: 0}, {label: "Boston", claim: gain_at_200k_boston, role: ink, at: 0}, {label: "Dallas", claim: gain_at_200k_dallas, role: ink, at: 0}, {label: "New York", claim: gain_at_200k_new_york, role: ink, at: 0}, {label: "Seattle", claim: gain_at_200k_seattle, role: warn, at: 0}, {label: "Phoenix", claim: gain_at_200k_phoenix, role: warn, at: 0}, {label: "San Diego", claim: gain_at_200k_san_diego, role: warn, at: 0}, {label: "Los Angeles", claim: gain_at_200k_los_angeles, role: warn, at: 0}, {label: "Miami", claim: gain_at_200k_miami, role: warn, at: 0}]}
  - id: S10                 # KEY-4b (loại 1)
    tail: 0.6
    shots:
      - id: S10-bars
        template: N2          # G2 (b): mẫu bars + dòng đơn vị
        from: "@S10.1"
        p: {mode: bars, unit: "Gain today · past the cap = gain over {excl_joint_limit_usd}", titleV: "Gain today, {illustrative_price_300k_usd} in {buy_year} · past the cap = over {excl_joint_limit_usd}", at: "@S10.1:300,000", title: "{illustrative_price_300k_usd} in {buy_year}, homes that rose like their metro average", items: [{label: "Chicago", claim: gain_at_300k_chicago, role: ink, at: "@S10.1+0.00"}, {label: "San Francisco", claim: gain_at_300k_san_francisco, role: warn, at: "@S10.1+0.15"}, {label: "San Jose", claim: gain_at_300k_san_jose, role: warn, at: "@S10.1+0.30"}, {label: "Denver", claim: gain_at_300k_denver, role: warn, at: "@S10.1+0.45"}, {label: "Boston", claim: gain_at_300k_boston, role: warn, at: "@S10.1+0.60"}, {label: "Dallas", claim: gain_at_300k_dallas, role: warn, at: "@S10.1+0.75"}, {label: "New York", claim: gain_at_300k_new_york, role: warn, at: "@S10.1+0.90"}, {label: "Seattle", claim: gain_at_300k_seattle, role: warn, at: "@S10.1+1.05"}, {label: "Phoenix", claim: gain_at_300k_phoenix, role: warn, at: "@S10.1+1.20"}, {label: "San Diego", claim: gain_at_300k_san_diego, role: warn, at: "@S10.1+1.35"}, {label: "Los Angeles", claim: gain_at_300k_los_angeles, role: warn, at: "@S10.1+1.50"}, {label: "Miami", claim: gain_at_300k_miami, role: warn, at: "@S10.1+1.65"}]}
      - id: S10-count
        template: N2          # G2 (b): mẫu bars + dòng đơn vị
        from: "@S10.2"
        p: {mode: bars, unit: "Gain today · past the cap = gain over {excl_joint_limit_usd}", titleV: "{metros_crossed_at_300k} of {metro_count} past the cap = gain over {excl_joint_limit_usd}", at: 0, title: "{metros_crossed_at_300k} of {metro_count} past the cap · homes that rose like their metro average", items: [{label: "Chicago", claim: gain_at_300k_chicago, role: ink, at: 0}, {label: "San Francisco", claim: gain_at_300k_san_francisco, role: warn, at: 0}, {label: "San Jose", claim: gain_at_300k_san_jose, role: warn, at: 0}, {label: "Denver", claim: gain_at_300k_denver, role: warn, at: 0}, {label: "Boston", claim: gain_at_300k_boston, role: warn, at: 0}, {label: "Dallas", claim: gain_at_300k_dallas, role: warn, at: 0}, {label: "New York", claim: gain_at_300k_new_york, role: warn, at: 0}, {label: "Seattle", claim: gain_at_300k_seattle, role: warn, at: 0}, {label: "Phoenix", claim: gain_at_300k_phoenix, role: warn, at: 0}, {label: "San Diego", claim: gain_at_300k_san_diego, role: warn, at: 0}, {label: "Los Angeles", claim: gain_at_300k_los_angeles, role: warn, at: 0}, {label: "Miami", claim: gain_at_300k_miami, role: warn, at: 0}]}
  - id: S11                 # KEY-5 (loại 1)
    tail: 1.0
    shots:
      - id: S11-miami
        template: N2          # G2 (b): mẫu line + đối trọng đứng
        from: "@S11.1"
        p: {mode: line, note: {text: "A measurement, not a next step", x: 180, y: 320},
            series: gain300.miami, level: excl_joint_limit_usd, levelLabel: "{excl_joint_limit_usd} cap", levelAt: "@S11.1",
            title: "Miami: {illustrative_price_300k_usd} home that rose like the Miami average",
            at0: "@S11.2+2.5", at1: "@S11.3$+1.8", illustrative: true, historical: true}
  - id: S12
    tail: 0.8
    shots:
      - id: S12-flip
        template: title
        from: "@S12.1"
        p: {at: "@S12.1", lines: ["Not just the coasts: Dallas and Denver crossed too", "So flip the question:", "what {buy_year} price puts the gain exactly at the cap?"],
            ats: ["@S12.1", "@S12.2", "@S12.3"]}
  - id: S13
    tail: 1.2
    shots:
      - id: S13-phoenix
        template: bignum
        from: "@S13.1"
        p:
          claim: threshold_joint_phoenix
          at: "@S13.1:about"
          caption: "Phoenix · {buy_year} price where the gain reaches the cap"
          captionAt: "@S13.1:Phoenix"
          historical: true
      - id: S13-ruler
        template: N2
        from: "@S13.2"
        p:
          mode: phoenix
          at: "@S13.2"
          dotAt: "@S13.2:Rosa"
          splitAt: "@S13.3"
          underAt: "@S13.3:under"
          overAt: "@S13.3:over"
          labels:               # vòng 2 kiểm mù: nhãn nghĩa B13 (2 dòng, khoảng trống phải thước)
