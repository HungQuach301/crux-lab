            - {text: "A measurement, not a tax bill or a next step", at: "@S14.1", x: 96, y: 1016, size: 40}
            - {text: "Every city but", at: "@S14.4:$300,000", x: 1470, y: 560, size: 40}
            - {text: "Chicago is", at: "@S14.4:$300,000", x: 1470, y: 608, size: 40}
            - {text: "under {illustrative_price_300k_usd}", at: "@S14.4:$300,000", x: 1470, y: 656, size: 40}
  - id: S15                 # KEY-7 (loại 1)
    tail: 0.6
    shots:
      - id: S15-q
        template: title
        from: "@S15.1"
        p: {at: "@S15.1", lines: ["Bought in {buy_year}: still fully tax-free?"], ats: ["@S15.1"]}
      - id: S15-phx
        template: line
        from: "@S15.2"
        p: {series: gain200.phoenix, level: excl_joint_limit_usd, levelLabel: "{excl_joint_limit_usd} cap", at0: "@S15.2", at1: "@S15.2+1.2",
