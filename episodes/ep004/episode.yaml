episode: ep004
format: lab            # 9–11 phút, 2 mid-roll ở ranh giới hồi (episode.md §9)
topic: "queue #3 — topics-r1/machine/tax-2 (G1 duyệt 2026-10-05)"
title: "Bought Your Home in 2000? The $500,000 Tax-Free Limit Test"
characters: "Rosa & Frank (ILLUSTRATIVE, Phoenix)"
hook: H2
tokenCeiling: {episode: 4500000, P2: 1000000, P3: 1000000}
pillar: thuế
midrolls: []           # ghi ở C2 khi có bảng nhịp
voice: {provider: elevenlabs, voice: cjVigY5qzO86Huf0OWal, model: eleven_v3, seed: 1004, settings: {stability: 0.5, speed: 0.9}}   # Eric (id như Tập 3)
music: {style: C}      # G-016

# ---- C3 style frame có chuyển động (nhà máy Mốc B): N1 "inflation shadow" (B08/S08) + N2 "threshold ladder" (B13–B14/S13–S14).
#   python3 episodes/ep004/data/fetch.py --verify && python3 episodes/ep004/model/model.py && python3 episodes/ep004/design/c3/build_inputs.py
#   bash toolkit/build.sh episodes/ep004/episode.yaml          (ghi chú: design/c3/NOTES.md)
scope: excerpt              # chỉ S08, S13, S14: bỏ luật thời lượng / mid-roll
script: design/c3/gen/script.json
claims: design/c3/gen/claims.json
tokens: design/c3/gen/tokens.json
data: {file: design/c3/work/data.js, var: DATA}
fps: 30
res: 1080
audio: {lufs: -14, true_peak: -1.5}
dossier: {script_md: story/script.md, claim_risk: ../../topics-r1/machine/tax-2/claim-risk.md}
# BẮT BUỘC (spec.py): claim-risk tax-2 "Always say" → hiện trên mọi khung có ngưỡng / tăng trưởng / lãi của một vùng.
# S08, S13, S14 không có nhãn "Counterweight on screen" trong script.md; hồ sơ không có contract.json.
counterweights:
  - id: avg-home
    text: "A home that rose like the metro average"
    claims: [threshold_joint_phoenix, threshold_joint_min, threshold_joint_max, gain_at_200k_phoenix,
             threshold_joint_miami, threshold_joint_los_angeles, threshold_joint_san_diego, threshold_joint_seattle, threshold_joint_new_york,
             threshold_joint_dallas, threshold_joint_boston, threshold_joint_denver, threshold_joint_us, threshold_joint_san_jose,
             threshold_joint_san_francisco, threshold_joint_chicago, growth_miami, growth_chicago]
  - id: measurement          # vòng 2 kiểm mù: đối trọng B08 (dòng engine trên-phải). B13/B14: nhãn shot N2 (p.labels, đáy-trái) —
    text: "A measurement, not a tax bill or a next step"   # dòng engine thứ 2 trên-phải đụng nhãn thước N2 → engine đẩy xuống giữa thước
    claims: [exclusion_effective_month, excl_joint_1997_in_now]
custom_symbols:             # 2 ký hiệu mới đã duyệt ở G1 (CHARTER §5: ≤ 2)
  - {id: N1, file: design/c3/n1.js}
  - {id: N2, file: design/c3/n2.js}

scenes:
  - id: S08
    tail: 1.2
    shots:
      - id: S08-shadow
        template: N1
        from: "@S08.1"
        p:
          at: "@S08.1"
          noteAt: "@S08.2:never"
          at0: "@S08.3"
          at1: "@S08.3:about"
          labelAt: "@S08.3:about"
          footAt: "@S08.3"
          bigAt: "@S08.4"
  - id: S13
    tail: 1.2
    shots:
      - id: S13-phoenix
        template: bignum
        from: "@S13.1"
        p:
          claim: threshold_joint_phoenix
          at: "@S13.1:about"
          caption: "Phoenix · {buy_year} price where the gain reaches the cap"
          captionAt: "@S13.1:Phoenix"
          historical: true
      - id: S13-ruler
        template: N2
        from: "@S13.2"
        p:
          mode: phoenix
          at: "@S13.2"
          dotAt: "@S13.2:Rosa"
          splitAt: "@S13.3"
          underAt: "@S13.3:under"
          overAt: "@S13.3:over"
          labels:               # vòng 2 kiểm mù: nhãn nghĩa B13 (2 dòng, khoảng trống phải thước)
            - {text: "Paid more in {buy_year} → bigger gain", at: "@S13.2:Rosa", x: 1000, y: 420}
            - {text: "→ over the cap", at: "@S13.2:Rosa", x: 1000, y: 476}
            - {text: "A measurement, not a tax bill or a next step", at: "@S13.2", x: 96, y: 1016, size: 40}
  - id: S14
    tail: 1.5                 # giữ 1,5 s (chỗ MR2)
    shots:
      - id: S14-ladder
        template: N2
        from: "@S14.1"
        p:
          mode: ladder
          at: "@S14.1"
          rungsAt0: "@S14.1:all"
          rungsAt1: "@S14.1:ladder"
          minAt: "@S14.2:Miami"
          maxAt: "@S14.2:Chicago"
          barsAt: "@S14.3:faster"
          gMinAt: "@S14.3:Miami's"
          gMaxAt: "@S14.3:Chicago's"
          refAt: "@S14.4:$300,000"
          titleAt: "@S14.5"
          labels:               # vòng 2 kiểm mù: nhãn nghĩa B14 (dải trên-trái; đối trọng đáy-trái; cột phải khi vạch $300,000 vào)
            - {text: "Each rung: the {buy_year} price where the gain hits the cap", at: "@S14.1:ladder", x: 96, y: 100, size: 40}
            - {text: "A measurement, not a tax bill or a next step", at: "@S14.1", x: 96, y: 1016, size: 40}
            - {text: "Every city but", at: "@S14.4:$300,000", x: 1470, y: 560, size: 40}
            - {text: "Chicago is", at: "@S14.4:$300,000", x: 1470, y: 608, size: 40}
            - {text: "under {illustrative_price_300k_usd}", at: "@S14.4:$300,000", x: 1470, y: 656, size: 40}
shorts: []
