<!doctype html>
<html><head><meta charset="utf-8"><title>Episode 2 film page</title>
<!-- C5: the page that draws every frame of out/video.mp4 (src/render_c5.js) and that the checker samples (window.CHECKS).
     Loads: Inter (3 weights, toolkit/render/fonts, OFL 1.1), work/c5/data-h2.js + data-h3.js (built locally by src/build_c5_data.py
     from the signed C3 data files; FRED-derived, not committed), build/film.js (esbuild bundle: npm ci && node src/build_page.mjs). -->
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../toolkit/render/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(../../../toolkit/render/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;src:url(../../../toolkit/render/fonts/inter-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent;overflow:hidden}
canvas{display:block}
</style>
<script src="work/c5/data-h2.js"></script>
<script src="work/c5/data-h3.js"></script>
</head><body>
<script>
// fonts first (canvas text measures with Inter), then the bundle
Promise.all([400, 600, 700].map((w) => document.fonts.load(w + ' 48px Inter'))).then(() => { const s = document.createElement('script'); s.src = 'build/film.js'; document.body.appendChild(s); });
</script>
</body></html>
