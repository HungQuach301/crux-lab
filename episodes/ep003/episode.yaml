# Tập 3 · demo nhà máy (Mốc B): một lệnh dựng cảnh S04 "The replay" bằng thư viện mẫu.
#   bash toolkit/build.sh episodes/ep003/episode.yaml
# Dữ liệu (một lần mỗi container): fetch.py --verify → model.py → claims.py → design/c3/build_data.py (README.md của tập).
episode: ep003
format: lab
scope: excerpt              # đoạn trích: bỏ luật thời lượng / mid-roll
script: out/script.json     # câu: id, scene, text (spoken do normalize.js tính lại)
claims: out/claims.json
tokens: design/c3/tokens.json
data: {file: design/c3/work/data.js, var: DATA}
fps: 30
res: 1080
voice: {provider: elevenlabs, voice: cjVigY5qzO86Huf0OWal, model: eleven_v3, seed: 1001, settings: {stability: 0.5, speed: 0.9}}
audio: {lufs: -14, true_peak: -1.0, music: null}
custom_symbols: []          # ≤ 2 ký hiệu viết mới mỗi tập; vượt → hỏi chủ dự án
midrolls: []                # lab: 2, ở ranh giới hồi (scope: excerpt → không xét)

# Mốc "@câu" = đầu câu, "@câu:từ" = đầu từ đó (viết như kịch bản; so trên lời đã chuẩn hoá), "@câu$" = cuối câu, "+s" lùi thêm.
# Shot bắt đầu ở "from", hết khi shot sau bắt đầu (shot cuối: hết cảnh). Hình không bao giờ đi trước từ nó neo.
scenes:
  - id: S04
    tail: 1.2
    shots:
      - id: S04-rate
        template: line
        from: "@S04.1"
        p:
          series: series
          x: 0
          y: 1
          title: "{bill_term_months}-month T-bill rate, every month"
          at0: "@S04.1:actual"
          at1: "@S04.2$"
          historical: true
      - id: S04-saver
        template: person
        from: "@S04.3"
        p:
          caption: ["Each start month = one saver", "money in, left alone"]
          at: "@S04.3:saver"
          ats: ["@S04.3:saver", "@S04.3:putting"]
      - id: S04-swarm
        template: swarm
        from: "@S04.4"
        p:
          series: windows
          value: roll
          key: s
          gate: 2
          gateDef: ctx_guarantee
          gateLabel: "×2"
          gateAt: "@S04.4"
          axisLabel: "money multiple after {horizon_years} years"
          legend: ["IF today's guarantee had existed", "Each dot: one {horizon_years}-year roll of T-bills"]
          legendHatch: true
          legendAt: "@S04.4"
          min: 1
          max: 4.9
          marks:
            - {match: "1972-05", label: "{max_start} · {max_tbill_multiple_20y}", at: "@S04.4:May 1972"}
            - {match: "1934-01", label: "{min_start} · {min_tbill_multiple_20y}", at: "@S04.4:January 1934"}
          at0: "@S04.5"
          at1: "@S04.6$"
          tally: "{starts} start months"
          tallyAt: "@S04.5:873"
          historical: true

shorts:
  - id: S04-short
    from: "@S04.4"
    to: "@S04.7$"
    hook: "Would T-bills have doubled it?"
    end: "Full replay on Crux"
