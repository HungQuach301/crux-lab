<!doctype html>
<html><head><meta charset="utf-8">
<style>
 html,body{margin:0;background:#0E1116;overflow:hidden}
 #ov{position:absolute;left:0;top:0;width:960px;height:540px;pointer-events:none;font-family:Inter,Arial,sans-serif;color:#F2F4F7}
 .lab{position:absolute;font-weight:700;font-size:26px;padding:6px 12px;border-radius:8px;background:rgba(14,17,22,.72);opacity:0;white-space:nowrap}
 .muted{color:#9AA4B2}.warn{color:#F2B441}
</style>
<script type="importmap">{"imports":{"three":"/toolkit/factory/world/vendor/node_modules/three/build/three.module.js"}}</script>
</head><body>
<div id="ov"></div>
<script type="module">
import * as THREE from 'three';
import { PALETTE, Studio, Person, Apartment, House, setOpacity } from '/toolkit/factory/world/lib3d.js';
import { Street, RentTag, NinaLamp } from '/episodes/ep008/preprod/objclip/obj8.js';
const clip = new URLSearchParams(location.search).get('clip') || 'street';
const data = await (await fetch('/episodes/ep008/preprod/objclip/data.json')).json();
const W = 960, H = 540;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); Studio(scene, { shadowBox: 40 });
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
const ov = document.getElementById('ov');
const lab = (html, x, y, cls = '') => { const d = document.createElement('div'); d.className = 'lab ' + cls; d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px'; ov.appendChild(d); return d; };
const ease = (a) => a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => ease((t - a) / (b - a));
const N = data.starts.length, street = Street({ starts: data.starts }); scene.add(street);
const gap = street.userData.gap, L = (street.userData.ny - 1) * gap, D = 11 * street.userData.rowGap;
const order = data.starts.map((s, i) => i);   // thứ tự thời gian = chỉ số
let seek;

if (clip === 'street') {
  // 0–1 s: lưới xám, máy thấp ở năm 1991 · 1–5 s: đèn bật theo thứ tự tháng (người mua hơn) / cửa amber (người thuê hơn); máy cẩu lên, lia theo năm
  // 5–6,4 s: máy lên thẳng đứng nhìn xuống (chế độ đồ thị) — nhãn năm + chú giải chỉ ở đây (quy tắc 1)
  const ahead = data.ahead['5'];
  const yl = [['1991', 0], ['2001', 10], ['2007', 16], ['2016', 25]].map(([t, c]) => [lab(t, 0, 0, 'muted'), c]);
  const k1 = lab('lit house: the buyer ended ahead after 10 years', 0, 0), k2 = lab('dark, amber door: the renter ended ahead', 0, 0, 'warn');
  k1.style.left = '20px'; k1.style.top = '14px'; k2.style.left = '20px'; k2.style.top = '58px';
  seek = (t) => {
    const sweep = ramp(t, 1.0, 5.0) * N;
    street.userData.set({ lit: ahead.map((a, i) => a ? Math.min(1, Math.max(0, sweep - i)) : 0), doorWarn: ahead.map((a, i) => a ? 0 : Math.min(1, Math.max(0, sweep - i))) });
    const k = ramp(t, 5.0, 6.4), xs = Math.min(L, (sweep / 12) * gap);
    const pw = new THREE.Vector3(xs - 3.5, lerp(1.6, 5.5, ramp(t, 1, 5)), 4.5), lw = new THREE.Vector3(xs + 1.0, 0.3, -D / 2);
    const pc = new THREE.Vector3(L / 2, 29, -D / 2 - 1.2 + 0.01), lc = new THREE.Vector3(L / 2, 0, -D / 2 - 1.2);
    cam.position.lerpVectors(pw, pc, k); cam.lookAt(new THREE.Vector3().lerpVectors(lw, lc, k));
    cam.updateMatrixWorld();
    const a = ramp(t, 6.2, 6.6);
    for (const [d, c] of yl) { const v = new THREE.Vector3(c * gap, 0, 1.0).project(cam); d.style.left = ((v.x + 1) / 2 * W - 30) + 'px'; d.style.top = ((1 - v.y) / 2 * H) + 'px'; d.style.opacity = a; }
    k1.style.opacity = a; k2.style.opacity = a;
  };
} else if (clip === 'tag') {
  // Căn hộ của Nina gần máy, thẻ RENT ở cửa; phố phía sau. Thẻ 5 % → 4 % (2,0 s) → 6 % (4,4 s): cả phố bật/tắt đèn theo
  street.position.set(-L / 2 + 2, 0, -1.5);
  const apt = Apartment({ w: 1.6, floors: 3 }); apt.position.set(-10.5, 0, 5.5); scene.add(apt);
  const tag = RentTag({ w: 0.8 }); tag.position.set(-10.5, 0.75, 5.5 + 0.56 + 0.04); scene.add(tag);
  const pat = (y) => data.ahead[String(y)];
  const tagY = (t) => t < 2.0 ? 5 : t < 4.4 ? 4 : 6;
  seek = (t) => {
    const y = tagY(t), prev = t < 2.0 ? 5 : t < 4.4 ? 5 : 4, t0 = t < 2.0 ? -9 : t < 4.4 ? 2.0 : 4.4;
    const k = ramp(t, t0 + 0.25, t0 + 1.2), a = pat(y), b = pat(prev);
    street.userData.set({ lit: a.map((v, i) => lerp(b[i] ? 1 : 0, v ? 1 : 0, k)), doorWarn: a.map((v, i) => lerp(b[i] ? 0 : 1, v ? 0 : 1, k)) });
    tag.userData.set({ value: y, swing: 0.18 * Math.exp(-3 * Math.max(0, t - t0)) * Math.sin(9 * Math.max(0, t - t0)) });
    cam.position.set(lerp(-13.6, -13.0, t / 7), 4.2, 12.5); cam.lookAt(-4.5, 0.6, 0.5);
  };
} else {
  // Nina: dáng nghỉ, đèn ấm riêng; đứng giữa căn hộ (thuê) và ngôi nhà (mua), đưa đèn nhìn bên này rồi bên kia
  street.visible = false;
  const apt = Apartment({ w: 2.0, floors: 3 }); apt.position.set(-3.0, 0, -0.5); scene.add(apt);
  const house = House({ w: 1.8 }); house.position.set(3.2, 0, -0.5); scene.add(house);
  const nina = Person({ h: 1.0 }); scene.add(nina);
  const lamp = NinaLamp(); scene.add(lamp);
  scene.children.forEach((o) => { if (o.isHemisphereLight) o.intensity = 0.45; if (o.isDirectionalLight) o.intensity *= 0.55; });
  const tag = lab('Nina · ILLUSTRATIVE', 20, 20, 'warn');
  const rt = RentTag({ w: 0.7, head: 'RENT', blank: true }); rt.position.set(-3.0, 0.62, -0.5 + 0.7 + 0.04); scene.add(rt);
  const bt = RentTag({ w: 0.7, head: 'BUY', blank: true }); bt.position.set(3.2 - 0.0, 0.5, -0.5 + 0.65 + 0.06); scene.add(bt);
  // vòng 2 (fix: picture): Nina ĐỨNG YÊN ở giữa, quay nhìn căn hộ (thuê) rồi ngôi nhà (mua) rồi lại căn hộ — không bước về phía nào
  seek = (t) => {
    nina.position.set(0, 0, 0.8);
    const look = -Math.sin(Math.PI * 2 * ramp(t, 0.8, 5.6));   // −1 = nhìn căn hộ (trái), +1 = nhìn nhà (phải)
    nina.rotation.y = 0; nina.rotation.z = -0.07 * look + 0.02 * Math.sin(t * 1.7);   // nghiêng người về phía đang nhìn
    lamp.position.set(0.45 * look, 1.05 + 0.04 * Math.sin(t * 2.3), 1.0);              // đèn của cô đưa về phía đang nhìn
    rt.scale.setScalar(1 + 0.12 * Math.max(0, -look)); bt.scale.setScalar(1 + 0.12 * Math.max(0, look)); lamp.userData.set({ on: ramp(t, 0.2, 0.9), t });
    cam.position.set(lerp(-0.4, 0.4, t / 6), 1.5, 6.0); cam.lookAt(0, 0.8, 0);
    tag.style.opacity = 1;
  };
}
window.seek = (t) => { seek(t); renderer.render(scene, cam); };
window.ready = true;
</script></body></html>
