<title>Crux Topic Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;600&display=swap">
<style>
/* Layout: one topic card per screen, a search-result style package on top (thumbnail sketch + title),
   the viewer / decision / promise below, optional reason chips, then a five-step verdict ladder. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --fg: #15211f; --muted: #566663; --line: #cfd9d6;
  --accent: #1d5c4f; --accent-fg: #ffffff; --soft: #dfeae6; --thumb: #20302c; --thumb-fg: #f4f8f6;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1615; --surface: #17211f; --fg: #e3ece9; --muted: #98aaa5; --line: #2b3a37;
  --accent: #7cc4b0; --accent-fg: #0c1714; --soft: #1f3530; --thumb: #0a100f; --thumb-fg: #eef5f2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1615; --surface: #17211f; --fg: #e3ece9; --muted: #98aaa5; --line: #2b3a37;
  --accent: #7cc4b0; --accent-fg: #0c1714; --soft: #1f3530; --thumb: #0a100f; --thumb-fg: #eef5f2; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 1rem; line-height: 1.45 }
main { max-width: 36rem; margin: 0 auto; padding: 1rem 16px 2rem; display: grid; gap: 1rem }
header { display: grid; gap: .4rem }
.meta { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; font: 500 .75rem var(--mono);
  color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s }
.q { font-family: var(--display); font-size: 1.05rem; margin: 0; text-wrap: balance }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; min-width: 0 }
.thumb { background: var(--thumb); color: var(--thumb-fg); aspect-ratio: 16 / 9; max-width: 100%; display: grid;
  grid-template-rows: 1fr auto; padding: .8rem .9rem; gap: .4rem }
.thumb .txt { align-self: center; font: 600 clamp(1.4rem, 6vw, 2rem)/1.1 var(--sans); text-wrap: balance; margin: 0 }
.thumb .obj { font-size: .78rem; opacity: .78; margin: 0 }
.thumb .obj b { font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-right: .3rem }
.body { padding: .9rem 1rem 1rem; display: grid; gap: .7rem }
.title { font-family: var(--display); font-weight: 600; font-size: 1.28rem; line-height: 1.25; margin: 0; text-wrap: balance }
dl { margin: 0; display: grid; gap: .55rem }
dl div { display: grid; gap: .1rem }
dt { font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
dd { margin: 0 }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center }
.chips span { font-size: .8rem; color: var(--muted); margin-right: .2rem }
.chip { font: 400 .85rem var(--sans); border-radius: 999px; padding: .35rem .75rem; min-height: 2.2rem }
.chip.on { background: var(--soft); border-color: var(--accent); color: var(--fg) }
.ladder { display: grid; gap: .45rem }
button { font: 600 1rem var(--sans); border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); padding: .7rem .8rem; cursor: pointer; min-height: 3rem; text-align: left }
.ladder button { display: grid; grid-template-columns: 1.6rem 1fr; gap: .5rem; align-items: center }
.ladder button i { font: 500 1rem var(--mono); font-style: normal; color: var(--accent) }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.ladder button.on i { color: var(--accent-fg) }
.nav { display: flex; justify-content: space-between; gap: .5rem }
.nav button { font-weight: 400; min-height: 2.6rem; padding: .5rem .9rem; text-align: center }
.done { display: grid; gap: .75rem }
.done h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0; text-wrap: balance }
.code { font: 500 .85rem var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: .8rem; word-break: break-word; user-select: all }
.hint { font-size: .85rem; color: var(--muted); margin: 0 }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .35rem }
.grid button { font: 500 .85rem var(--mono); min-height: 2.4rem; padding: .3rem; text-align: center }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none } }
</style>
<style>
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; display: grid; gap: .55rem; min-width: 0 }
.item h2 { font-family: var(--display); font-weight: 600; font-size: 1.12rem; line-height: 1.25; margin: 0; text-wrap: balance }
.item ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; font-size: .93rem }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem }
.yn button { text-align: center }
.tag { font: 500 .72rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
</style>
<main>
  <header><div class="meta"><span>Bước 2 · hàng đợi đề tài</span><span id="left"></span></div>
  <p class="q">Đề tài nào vào hàng đợi? Có = vào <code>topics/queue.md</code> (chưa phải chọn làm tập). Không = bỏ.</p></header>
  <div id="list" style="display:grid;gap:.9rem"></div>
  <section class="done"><h2>Dán mã này vào phiên</h2><div class="code" id="code"></div><button id="copy" style="text-align:center">Copy code</button><p class="hint" id="note"></p></section>
</main>
<script>
const D = [{"id": "debt-2", "no": "17", "score": 5, "title": "7.5% Variable or 9% Fixed? Grad Loans Through History", "lines": ["Kết quả: trên 753 cửa sổ 10 năm từ 1954, khoản vay biến đổi đắt hơn cố định 14,2 % số lần; riêng giai đoạn bắt đầu 1954–1980 là 28,4 %, từ 1981 trở đi chỉ 3,5 %; tệ nhất (4/1977) đắt hơn $11.219.", "Vì sao đổi quyết định: thường rẻ hơn (trung vị rẻ hơn $3.832) nhưng rủi ro dồn vào thời kỳ lãi tăng kéo dài.", "Dữ liệu: lãi tín phiếu 3 tháng (FRED) làm chỉ số thay; hợp lệ V0–V5.", "Rủi ro: khoản vay thật dùng chỉ số kiểu SOFR, có trần lãi và biên theo tín dụng — tập không được nói 'khoản vay của bạn sẽ…'."]}, {"id": "tax-4", "no": "02", "score": 4, "title": "Overtime or a Second Job at $48 an Hour: Which Pays More?", "lines": ["Kết quả: chỉ phần trả thêm nửa lương ($6.400) được trừ thuế; làm thêm giờ giữ $14.915 so với $13.507 ở việc thứ hai (+$1.408/năm); việc thứ hai cần ~$53/giờ để hoà.", "Vì sao đổi quyết định: người xem tưởng cả khoản làm thêm giờ được miễn thuế; khoảng cách thật là cố định và nhỏ.", "Dữ liệu: lương giờ bình quân (FRED) + luật thuế qua law.cornell.edu và irs.gov; hợp lệ V0–V5.", "Rủi ro: báo chí đã nói 'chỉ phần trả thêm được trừ'; cái mới là so với việc thứ hai. Câu kết quả ghi 29,6 %, giá trị đúng 29,65 %."]}, {"id": "tax-2", "no": "04", "score": 4, "title": "Bought Your Home in 2000? The $500,000 Tax-Free Limit Test", "lines": ["Kết quả: nhà tăng giá như chỉ số vùng từ 2000 vượt mức miễn thuế $500.000 khi giá mua năm 2000 trên ~$114.700 (Miami), $151.500 (LA), $215.600 (Dallas), $373.400 (Chicago); 11/12 vùng dưới $300.000.", "Vì sao đổi quyết định: mức $500.000 không đổi từ 1997 (theo giá 2026 ≈ $1.046.000); nhiều người tưởng bán nhà là miễn thuế.", "Dữ liệu: 12 chỉ số giá nhà vùng + CPI (FRED), luật qua law.cornell.edu; hợp lệ V0–V5.", "Rủi ro: chỉ số vùng ≠ căn nhà cụ thể; chưa tính chi phí cải tạo; số liệu chỉ số được sửa hằng quý."]}, {"id": "tax-1", "no": "06", "score": 4, "title": "Your $3,000 Tax Refund: What Is It Really Costing You?", "lines": ["Kết quả: khoản hoàn $3.000 bị giữ tương đương 7,5 tháng; năm thuế 2025 tốn ~$72 theo lãi tín phiếu, ~$7 theo lãi tiết kiệm bình quân, ~$396 nếu đang nợ thẻ.", "Vì sao đổi quyết định: với người không nợ thẻ chi phí chỉ vài chục đô; với người nợ thẻ gấp khoảng 10 lần.", "Dữ liệu: lãi tín phiếu, lãi thẻ, lãi tiết kiệm (FRED) + luật thuế; hợp lệ V0–V5.", "Rủi ro: tiêu đề nói 'Your' — tập chỉ chứng minh cho hộ minh hoạ; không khuyên đổi khấu trừ lương."]}, {"id": "debt-3", "no": "07", "score": 4, "title": "60 vs 72 Months on a $35,000 Car Loan: The Real Cost", "lines": ["Kết quả: 44 quý (2015–2026) lãi ngân hàng kỳ hạn 72 tháng chỉ cao hơn 60 tháng trung bình 0,1 điểm, thấp hơn 14 lần; trên $35.000, 72 tháng tốn thêm $1.206 tiền lãi, gần hết là do thời gian chứ không do lãi.", "Vì sao đổi quyết định: lời khuyên phổ biến nói lãi 72 tháng cao hơn 0,5–1,25 điểm.", "Dữ liệu: hai chuỗi lãi vay xe ngân hàng (FRED); hợp lệ V0–V5.", "Rủi ro: chỉ là lãi ngân hàng (không phải đại lý/công ty tài chính); không đo mất giá xe hay nợ âm."]}, {"id": "retire-2", "no": "08", "score": 4, "title": "Long-Term Care Insurance: 3% or 5% Inflation Protection?", "lines": ["Kết quả: giá cơ sở dưỡng lão (1994–2026) tăng 2,8–3,6 %/năm qua mọi cửa sổ 20 năm; quyền chọn 3 % phủ trung vị 98 % giá sau 20 năm, 5 % phủ 144 %, không có quyền chọn chỉ 54 %.", "Vì sao đổi quyết định: lý do mua gói 5 % thường là 'chi phí chăm sóc tăng 5 %/năm' — dữ liệu này không cho thấy thế.", "Dữ liệu: chỉ số giá sản xuất cơ sở dưỡng lão (FRED); hợp lệ V0–V5.", "Rủi ro: chỉ số giá sản xuất ≠ giá gia đình trả; không nói được gói 5 % 'không đáng tiền'."]}, {"id": "retire-4", "no": "09", "score": 4, "title": "Savings Bonds That Double in 20 Years vs T-Bills", "lines": ["Kết quả: cuộn tín phiếu 20 năm vượt mức gấp đôi ở 52,3 % điểm bắt đầu từ 1934, nhưng chỉ 5,0 % từ 1990; giai đoạn gần nhất (2006–2026) chỉ ra 1,378 lần.", "Vì sao đổi quyết định: người xem nhìn lãi tín phiếu hôm nay; đó chỉ là 1 trong 80 mức lãi họ sẽ nhận.", "Dữ liệu: lãi tín phiếu 3 tháng + CPI (FRED), quy định trái phiếu qua law.cornell.edu; hợp lệ V0–V5.", "Rủi ro: bảo đảm gấp đôi chỉ có từ 2005 — trước đó là giả định; nói rõ 'history, not a forecast'."]}, {"id": "tax-3", "no": "10", "score": 4, "title": "Sell at 11 Months or Wait for the Lower Tax Rate?", "lines": ["Kết quả: chờ 1 tháng tiết kiệm $900 thuế; chỉ số giảm >2,12 % trong tháng chờ (xoá khoản tiết kiệm) ở 17,8 % số cửa sổ 2016–2026; 5 % cửa sổ tệ nhất mất ≥ $1.825.", "Vì sao đổi quyết định: người xem coi việc chờ là không rủi ro hoặc coi rủi ro là lớn — dữ liệu cho tần suất và cỡ thật.", "Dữ liệu: chỉ số S&P 500 (FRED) + luật thuế; hợp lệ V0–V5.", "Rủi ro: dữ liệu chỉ số có điều khoản cấm tái bản — chỉ được dùng số đã tính, cần xác nhận quyền trước khi làm tập."]}, {"id": "debt-4", "no": "11", "score": 4, "title": "Paying a Point to Get 6.75%? What History Says", "lines": ["Kết quả: một điểm phí hoà vốn sau 59,9 tháng; ở 53,1 % tuần từ 1971, lãi đã giảm ≥ 1,25 điểm (đủ để tái cấp vốn) trước lúc hoà vốn, trung vị sau 18,9 tháng.", "Vì sao đổi quyết định: trả điểm phụ thuộc người mua có tái cấp vốn hay không, chứ không chỉ thời gian ở lại nhà.", "Dữ liệu: lãi vay nhà 30 năm hằng tuần (FRED; cùng chuỗi Tập 1, khác quyết định); hợp lệ V0–V5.", "Rủi ro: gần với chủ đề Tập 1 (tái cấp vốn); 'history, not a forecast'."]}, {"id": "retire-3", "no": "12", "score": 4, "title": "1-Year CD Pays More Than a 5-Year: Roll or Lock?", "lines": ["Kết quả: 132 tháng lãi 1 năm cao hơn 5 năm (1953–2022), khoá 5 năm vẫn ra nhiều tiền hơn 64,4 % số lần (trung vị +2,5 %); cuộn 1 năm thắng lớn khi lãi tiếp tục tăng (1978–80, 2022).", "Vì sao đổi quyết định: người về hưu chọn theo lãi niêm yết cao hơn — tức 1 năm.", "Dữ liệu: lợi suất trái phiếu chính phủ 1 năm và 5 năm (FRED) làm thay lãi CD; hợp lệ V0–V5.", "Rủi ro: lãi CD thật khác lợi suất trái phiếu; đợt 2022–24 chưa chấm hết được."]}, {"id": "debt-1", "no": "14", "score": 4, "title": "3% Mortgage vs T-Bills: Where Should the $500 Have Gone?", "lines": ["Kết quả: $500/tháng từ 1/2022 đến 8/2026 vào tín phiếu hơn trả bớt nợ $1.002 trước thuế; sau thuế còn $285 (bậc 22 %), âm $34 (bậc 32 %); hoà ở thuế suất 30,9 %.", "Vì sao đổi quyết định: người xem đoán tín phiếu thắng hàng nghìn đô; thực tế gần như hoà.", "Dữ liệu: lãi tín phiếu 3 tháng (FRED) + luật miễn thuế tiểu bang; hợp lệ V0–V5.", "Rủi ro: số chênh nhỏ, nhạy với làm tròn và giả định thuế."]}, {"id": "retire-1", "no": "15", "score": 4, "title": "Does a 2% Annuity Raise Really Keep Up With Prices?", "lines": ["Kết quả: trên 715 cửa sổ 20 năm từ 1947, khoản tăng 2 %/năm giữ được sức mua chỉ 2,4 % số lần (đều bắt đầu 1947–49); sau 20 năm thường còn mua được 80,7 % (kiểu cố định: 54,3 %).", "Vì sao đổi quyết định: người mua trả giá cho 'bảo vệ lạm phát' nhưng 2 % chỉ bảo vệ một phần ở mọi thời kỳ.", "Dữ liệu: CPI (FRED); hợp lệ V0–V5.", "Rủi ro: không so giá niên kim thật của hai lựa chọn; 'history, not a forecast'."]}];
const KEY='crux-topics-r1-step2'; let st={};
try { st = JSON.parse(localStorage.getItem(KEY)||'{}')||{}; } catch(e) {}
const $=id=>document.getElementById(id);
function code(){ return 'S2 '+D.map(d=>d.id+':'+(st[d.id]||'?')).join(' '); }
function render(){
  $('list').textContent='';
  D.forEach(d=>{
    const a=document.createElement('article'); a.className='item';
    const t=document.createElement('span'); t.className='tag'; t.textContent='Thẻ '+d.no+' · điểm '+d.score; a.appendChild(t);
    const h=document.createElement('h2'); h.textContent=d.title; a.appendChild(h);
    const u=document.createElement('ul'); d.lines.forEach(l=>{const li=document.createElement('li'); li.textContent=l; u.appendChild(li);}); a.appendChild(u);
    const yn=document.createElement('div'); yn.className='yn';
    [['C','Có — vào hàng đợi'],['K','Không']].forEach(([v,l])=>{const b=document.createElement('button'); b.id=d.id+'-'+v; b.textContent=l; if(st[d.id]===v) b.classList.add('on');
      b.addEventListener('click',()=>{st[d.id]=v; try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} render();}); yn.appendChild(b);});
    a.appendChild(yn); $('list').appendChild(a);
  });
  const left=D.filter(d=>!st[d.id]).length; $('left').textContent=left?left+' còn lại':'đủ 12';
  $('code').textContent=code();
}
$('copy').addEventListener('click',()=>{const t=code(); const ok=()=>{$('note').textContent='Đã copy.';};
  const fb=()=>{const r=document.createRange(); r.selectNodeContents($('code')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('note').textContent='Đã chọn mã, hãy copy.';};
  try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}});
render();
</script>
