<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Inter;font-weight:700;src:url(/toolkit/render/fonts/inter-latin-700-normal.woff2) format('woff2')}html,body{margin:0;background:#0E1116}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Thumbnail from a 1080p factory frame: ≤ 3 words, one colour role, the frame's own ILLUSTRATIVE badge kept. ?img=<repo path>&t=<words>
const q = new URLSearchParams(location.search), words = q.get('t') || '';
if (words.replace(/ \/ /g, ' ').trim().split(/\s+/).length > 3) throw new Error('thumbnail: ≤ 3 words');
await document.fonts.load('700 200px Inter');
const im = new Image(); im.src = '/' + q.get('img'); await im.decode();
const ctx = document.getElementById('c').getContext('2d'); ctx.drawImage(im, 0, 0, 1920, 1080);
const lines = words.split(' / '); let y = 400;
ctx.textAlign = 'left'; ctx.lineJoin = 'round';
for (const [i, s] of lines.entries()) { ctx.font = '700 210px Inter';
  ctx.lineWidth = 26; ctx.strokeStyle = '#0E1116'; ctx.strokeText(s, 900, y); ctx.fillStyle = i ? '#F2B441' : '#F2F4F7'; ctx.fillText(s, 900, y); y += 240; }
window.READY = true;
</script></body></html>
