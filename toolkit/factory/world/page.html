<!doctype html>
<html><head><meta charset="utf-8"><title>Crux · thế giới 3D (một thế giới, hai chế độ máy quay)</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(/toolkit/render/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(/toolkit/render/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;src:url(/toolkit/render/fonts/inter-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;background:#0e1116} canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"/toolkit/factory/world/vendor/node_modules/three/build/three.module.js","three/addons/":"/toolkit/factory/world/vendor/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
const q = new URLSearchParams(location.search);
// core.CK (nhà máy): ?dither=0|1|2 (mặc định 2, F08) · ?orient=v[&vs=1&vcy=920&hook=…&cws=<JSON [{id,text}]>&vt0=<s>] = Short dọc 1080×1920 (res = 1920)
const { CK } = await import('/toolkit/factory/world/core.js');
if (q.has('dither')) CK.dither = +q.get('dither');
if (q.get('orient') === 'v') CK.view = { orient: 'v', s: +(q.get('vs') || 1), cy: q.has('vcy') ? +q.get('vcy') : undefined, hook: q.get('hook') || '', cws: JSON.parse(q.get('cws') || '[]'), t0: +(q.get('vt0') || 0) };
const { boot } = await import(`/${q.get('seg')}/scene.js`)   // seg = thư mục đoạn tính từ gốc repo;
const S = await boot(+(q.get('res') || 540));
window.APP = { canvas: S.canvas, frame: (t) => S.frame(t) };
window.READY = true;
</script>
</body></html>
