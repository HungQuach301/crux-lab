<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2); }
html, body { margin: 0; background: transparent; overflow: hidden; width: 1920px; height: 1080px; }
</style></head>
<body>
<script>
// crux-lab: the episode is chosen by the query string, page.html?root=<episode root> (absolute path). The page loads
// <root>/render/data.js (window.DATA) and <root>/render/scenes-ep.js (the episode's scene builders, after scenes.js).
(function () {
  const root = new URLSearchParams(location.search).get('root');
  if (!root) { document.write('<p style="color:#fff">page.html needs ?root=&lt;episode root&gt;</p>'); return; }
  const f = (p) => 'file://' + root.replace(/\/$/, '') + '/render/' + p;
  const src = [f('data.js'), 'engine.js', 'cameras.js', 'scenes.js', f('scenes-ep.js'), 'page.js'];
  for (const s of src) document.write('<script src="' + s + '"><\/script>');
})();
</script>
</body></html>
